; SPatch for Sleeping Dogs: Definitive Edition
; Change a value, save the file, then restart the game.
; For on/off options, 1 enables and 0 disables. Numeric options document their own values.

[SPatch]
; Internal format version. Do not change.
ConfigVersion=44

; Master switch for the patch.
Enabled=1

[Cutscenes]
; Fix brief 30 FPS/duplicate-frame cutscene timing fallbacks.
FixCutsceneFPS=1
; 0 follows live FPS. Any fixed target from 15 to 1000 is also accepted.
; A fixed target should match the cap selected in-game, in the driver, or externally.
CutsceneFPS=0

; Prevent duplicate actor restoration after affected cutscenes.
FixDuplicateCutsceneActorRestore=0

; -1 keeps the game value, 0 disables, 1 enables stock adaptive smoothing.
; The stock smoother always uses at most eight samples.
TimeStepSmoothing=1

[Input]
; Force the game's hidden Windows Raw Input path for mouse movement.
ForceRawMouseInput=1

; Remove the stock FollowCamera easing from mouse look and aiming.
; Controller look is already sampled directly and has no temporal smoothing.
DisableCameraSmoothing=1

; GTA IV-like camera for exact road-vehicle Drive/Flee paths, including trucks and buses.
; Adds a right-seat offset, loose follow, manual yaw/pitch, delayed recentering, and handbrake swing.
; Race, Hijack, Aim, Look, reverse, and special override paths stay stock.
; 1 enables and 0 disables. Changing this requires a restart.
GTAIVCarCamera=0

; Apply the same GTA IV-like behavior independently to motorcycle/scooter Drive cameras.
; The exact Drive branch must be active even when Race or HijackFront aliases its block.
; Distinct Aim, Flee, look, passenger, and hijack camera blocks remain stock.
; 1 enables and 0 disables. Changing this requires a restart.
GTAIVBikeCamera=0

; Left-stick radial deadzone in percent: -1 keeps stock, 0 is unfiltered, 1-95 is custom.
LeftStickDeadzone=-1
; Right-stick radial deadzone in percent: -1 keeps stock, 0 is unfiltered, 1-95 is custom.
RightStickDeadzone=-1

[Graphics]
; Restore the original game's clearer atmosphere and focused neon glow.
; Disables only DE's added volumetric fog. Changing this requires a restart.
RestoreOriginalFogAndNeon=1

; Restore iris detail and reflections on Wei's affected HD and gang models.
RestoreOriginalEyeReflections=1

; Restore rain and post-swim wetness on character materials (Wei and NPCs).
RestoreWetness=1
; Seconds characters remain fully wet after leaving water. Range: 0-3600.
WetnessFullTime=30
; Seconds wetness then takes to fade linearly. Range: 0-3600.
WetnessFadeTime=270

; Restore sweat from sustained running and combat for Wei and NPCs.
RestoreSweat=1

; Seconds of sustained exertion needed to reach full sweat. Range: 0-3600.
SweatBuildTime=150
; Seconds sweat takes to fade after exertion stops. Range: 0-3600.
SweatFadeTime=120
; Seconds of continuous exertion before sweat becomes visible. Range: 0-3600.
SweatOnsetTime=30
; Horizontal movement speed that counts as running. Range: 0-100.
SweatRunSpeed=2.5
; Seconds an NPC remains exerting after taking melee damage. Range: 0-3600.
SweatCombatTime=15

; Keep the pedestrian-density controller at its intended 30 Hz cadence.
FixPedestrianDensity=1

; Preserve verified camera and vehicle-control history at high FPS.
FixHighFPSAverages=1

; Scale the hardcoded 1280x640 spherical-reflection target.
ImproveSphericalReflections=1
; 0 follows the active display width; custom values are clamped to 1280-4096.
SphericalReflectionWidth=0

; Report the complete dedicated VRAM amount on the benchmark screen.
FixVRAMReporting=1

; -1 keeps the game setting, 0 is low, 1 medium, 2 high.
TextureDetail=-1

; -1 keeps the game setting, 0 disables, 1 normal, 2 high quality.
MotionBlur=-1

[TextureFiltering]
; -1 keeps the game setting; supported forced levels are 4, 8, and 16.
AnisotropicFiltering=16
; Also promote the exact stock trilinear filter-selector branch.
ForceAnisotropicFiltering=1

[Shadows]
; Keep the game's native shadow filtering and quality selection.
; Original filtering quality: -1 follows the in-game option, 0 normal, 1 high.
OriginalShadowFilter=-1

[Display]
; Correct the invalid 1920x1880 resolution on a new profile.
FixFirstRunResolution=1

; Use the highest refresh rate exposed for the selected resolution.
UseMaximumRefreshRate=0

; Remove the hidden 120 FPS wait when the stock limiter is Off.
; Explicit limiter modes and VSync are unchanged.
Remove120FPSCap=1

; -1 keeps the game setting, 0 forces windowed, 1 forces fullscreen.
Fullscreen=-1
; -1 keeps the game setting, 0 is Off, 1-4 select stock limiter modes.
FrameLimiter=-1
; -1 keeps the game setting, 0 disables, 1 enables.
LowResolutionBuffer=0

[Gameplay]
; -1 keeps the game setting; 0-4 select a stock world-density level.
WorldDensity=-1
; -1 keeps the game setting, 0 disables, 1 enables controller rumble.
Rumble=-1

[Stability]
; Guard the stock fog update path against invalid slicing intervals.
FixFogSlicing=1

; Keep Scaleform's performance-counter clock full-width on long-running systems.
FixScaleformTimerOverflow=1

; Open existing files correctly when updating their timestamps.
FixFileTimestampUpdates=1

; Handle missing audio metadata files without using an invalid mapping handle.
FixAudioFileOpen=1

; Preserve complete 64-bit file sizes for files of 4 GiB or larger.
FixLargeFileSizes=1

; Balance the recursive VRAM-pool lock during pool shutdown.
FixVRAMPoolLock=1

; Recover cleanly from failed resource reads and reject malformed archives,
; compressed data, and resource chunks before they reach unsafe stock paths.
FixResourceLoading=1

; Remove an unused contact-image formatter that can overflow its stack buffer.
FixContactListOverflow=1

; Reject truncated save payloads before the stock checksum/table reader.
FixCorruptSaveCrash=1

; Translate CreateThread failure to the sentinel expected by the engine.
FixThreadCreationFailure=1

[AntiAliasing]
; Replace the stock post-process anti-aliasing with SMAA.
SMAA=1
; Stock AA is disabled only after SMAA proves the current render path ready.
; If SMAA cannot run, the game automatically keeps its native AA.
; SMAA quality: 0 low, 1 medium, 2 high, 3 ultra (recommended).
SMAAPreset=3

[Debug]
; Write SPatch.log next to the mod for troubleshooting. Disabled by default.
; Logging takes effect after restarting the game.
Logging=0

; Write a small diagnostic dump if the game crashes.
WriteCrashDumps=1